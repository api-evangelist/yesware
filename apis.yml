aid: yesware
name: Yesware
description: >-
  Yesware is a sales engagement and email productivity platform that lives
  inside Gmail and Outlook, helping sales teams track email opens, link clicks,
  and attachment views in real time, run multi-touch outreach campaigns and
  sequences, use shared email templates, schedule meetings, and prospect from a
  database of 100M+ B2B contacts. It provides bi-directional Salesforce sync to
  log activities automatically and reporting dashboards on template and team
  performance. Yesware has been part of Vendasta since October 2022. It does not
  expose a public developer REST API, GraphQL endpoint, webhook catalog, MCP
  server or agent card — its own help center answered "does Yesware have a
  public-facing API" with no, and its entire documentation set at
  docs.yesware.com is end-user product help. The integration surface is delivered
  through Salesforce sync, native Gmail/Outlook inbox extensions, LinkedIn, Zoom,
  Google Meet and Microsoft Teams connectors, and third-party iPaaS platforms.
  The most machine-readable surface Yesware operates is its Atlassian Statuspage.
  It was surfaced as a portfolio company of Battery Ventures and GV and profiled
  in the API Evangelist network.
